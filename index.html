<!DOCTYPE html>
<html>
    <head>
        <title>Boba bash photo wall</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bubble: '#a9d8ee',
                        bubbleInk: '#274156',
                        surface: '#fbf6e8',
                        surfaceAlt: '#f0e9d8',
                        ink: '#3d2b18',
                        inkMuted: '#6b5842',
                        inkSoft: '#9a8064',
                        goldenrod: '#f2c14e',
                        apply_gradient: "linear-gradient(180deg,#c0dfc6 0%,#85c5da 44%,#6fbbe2 81%,#b6dbc9 100%)"
                    },
                    fontFamily: {
                        display: ['Baloo 2', 'sans-serif'],
                        body: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
        </script>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
        <style>
            body { font-family: 'Poppins', sans-serif;}
            .cropper-view-box,
            .cropper-face {
                border-color: #3d2b18 !important;
            }
            .cropper-line {
                background-color:  #3d2b18 !important;
            }
            .cropper-point {
                background-color: #f2c14e !important;
            }
            .cropper-crop-box {
            border-color: #3d2b18 !important;
            }
        </style>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="bg-surface">
        <header class="bg-surfaceAlt border-b-2 border-inkSoft px-6 py-4 flex justify-between items-center">
            <img src="img/logowordmark.png" alt="Boba Bash" class="h-20 my-2">
            <span class="font-body text-inkMuted text-2xl">Photo Wall</span>
        </header>
        <div id="wallContainer" class="p-4 flex flex-wrap gap-4"></div>

        <button id="btnOpenUpload" class = "fixed bottom-6 right-6 bg-goldenrod text-inkMuted rounded-full border-2 border-inkMuted hover:border-ink hover:scale-105 hover:text-ink w-14 h-14 text-2xl shadow-lg">+</button>

        <div id="uploadModal" class="hidden fixed inset-0 bg-inkSoft/40 flex items-center justify-center">
            <div class="bg-surface border-2 border-inkMuted p-6 w-80">
                <button id="btnCloseUpload" class="float-right text-ink">✕</button>
                <h2 class="font-bold text-ink mb-4">upload your pics!</h2>
                <label for="photoInput" class="block bg-surface border-2 border-dashed border-inkSoft rounded-lg p-6 text-center text-ink cursor-pointer hover:bg-surfaceAlt mb-4">Press to upload your photos</label>
                <input id="photoInput" type="file" accept="image/*" multiple class="mb-4 hidden">
                <button id="btnUpload" class="bg-goldenrod border-2 border-inkMuted text-ink px-4 py-2 rounded w-full">UPLOAD</button>
                <div id="UpStatus" class="mt-2 text-sm"></div>
            </div>
        </div>
        
        <button id="btnShare" class="fixed bottom-24 right-6 bg-bubble text-inkMuted rounded-full w-14 h-14 flex items-center justify-center shadow-lg border-2 border-inkMuted hover:border-ink transition-transform duration-200 hover:scale-110 hover:text-ink">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
        </button>

        <div id="shareModal" class="hidden fixed inset-0 bg-inkSoft/40 flex items-center justify-center">
            <div class="bg-surface border-2 border-inkMuted p-6 w-80 relative">
                <button id="btnCloseShare" class="absolute top-3 right-3 text-ink">✕</button>
                <div id="qr" class="p-4 flex justify-center mb-2"></div>
                <div class="rounded-2xl bg-gradient-to-b from-[#c0dfc6] via-[#85c5da] to-[#6fbbe2] p-4 border-2 border-inkMuted">
                    <h3 id="linkCopy" class="text-xs text-center text-ink break-all my-3"></h3>
                    <button id="btnCopyLink" class="w-full flex items-center justify-center gap-2  text-ink px-4 py-2 rounded border-inkMuted hover:bg-bubble ">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span>Copy Link</span>
                    </button>
                </div>    
            </div>
        </div>

        <div id="cropModal" class="hidden fixed inset-0 bg-inkSoft/40 flex items-center justify-center z-50">
            <div class="bg-surface border-2 border-inkMuted p-6 w-80 relative">
                <h2 class="font-bold text-ink mb-4">Adjust your photo</h2>
                <div class="w-full h-64">
                    <img id="cropperImage" class="max-w-full">
                </div>
                <button id="btnConfirmCrop" class="mt-4 bg-goldenrod border-2 border-inkMuted text-ink px-4 py-2 rounded w-full">Ready</button>                
            </div>
        </div>





        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/wall.js"></script>
        <script src="js/upload.js"></script>
    </body>
</html>
