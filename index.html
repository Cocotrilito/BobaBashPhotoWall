<!DOCTYPE html>
<html>
    <head>
        <title>Boba bash photo wall</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bubble: '#a9d8ee',
                        bubbleInk: '#274156',
                        surface: '#fbf6e8',
                        surfaceAlt: '#f0e9d8',
                        ink: '#3d2b18',
                        inkMuted: '#6b5842',
                        inkSoft: '#9a8064',
                        goldenrod: '#f2c14e',
                    },
                    fontFamily: {
                        display: ['Baloo 2', 'sans-serif'],
                        body: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
        </script>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
        <style>
            body { font-family: 'Poppins', sans-serif;}
        </style>
    </head>
    <body class="bg-surface">
        <header class="bg-surfaceAlt border-b-2 border-inkSoft px-6 py-4 flex justify-between items-center">
            <img src="img/logowordmark.png" alt="Boba Bash" class="h-20 my-2">
            <span class="font-body text-inkMuted text-2xl">Photo Wall</span>
        </header>
        <div id="wallContainer" class="p-4 flex flex-wrap gap-4"></div>

        <button id="btnOpenUpload" class = "fixed bottom-6 right-6 bg-goldenrod text-inkMuted rounded-full border-2 border-inkMuted hover:border-ink hover:scale-105 hover:text-ink w-14 h-14 text-2xl shadow-lg">+</button>

        <div id="uploadModal" class="hidden fixed inset-0 bg-inkSoft/40 flex items-center justify-center">
            <div class="bg-surface border-2 border-inkMuted p-6 w-80">
                <button id="btnCloseUpload" class="float-right text-ink">✕</button>
                <h2 class="font-bold text-ink mb-4">upload your pics!</h2>
                <label for="photoInput" class="block bg-surface border-2 border-dashed border-inkSoft rounded-lg p-6 text-center text-ink cursor-pointer hover:bg-surfaceAlt mb-4">Press to upload your photos</label>
                <input id="photoInput" type="file" accept="image/*" multiple class="mb-4 hidden">
                <button id="btnUpload" class="bg-goldenrod border-2 border-inkMuted text-ink px-4 py-2 rounded w-full">UPLOAD</button>
                <div id="UpStatus" class="mt-2 text-sm"></div>
            </div>
        </div>
        
        <button id="btnShare" class="fixed bottom-24 right-6 bg-bubble text-ink rounded-full w-14 h-14 flex items-center justify-center shadow-lg border-2 border-inkMuted hover:border-ink transition-transform duration-200 hover:scale-110">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
        </button>

        <div id="shareModal" class="hidden fixed inset-0 bg-inkSoft/40 flex items-center justify-center">
            <div class="bg-surface border-2 border-inkMuted p-6 w-80">
                <button id="btnCloseShare" class="float-right text-ink">✕</button>
                <img id="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://cocotrilito.github.io/BobaBashPhotoWall/">
            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/wall.js"></script>
        <script src="js/upload.js"></script>
    </body>
</html>
