<!DOCTYPE html>
<html>
    <head>
        <title>Boba bash photo wall</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <div id="wallContainer" class="p-4 flex flex-wrap gap-4"></div>

        <button id="btnOpenUpload" class = "fixed bottom-6 right-6 bg-blue-500 text-white rounded-full w-14 h-14 text-2xl shadow-lg">+</button>

        <div id="uploadModal" class="hidden fiexd inset-0 bg-black/50 flex items-center justify-center">
            <div class="bg-white rounded-lg p-6 w-80">
                <button id="btnCloseUpload" class="float-right text-gray-500">✕</button>
                <h2 class="font-bold mb-4">upload your pics!</h2>
                <input id="photoInput" type="file" accept="image/*" multiple class="mb-4">
                <button id="btnUpload" class="bg-blue-500 text-white px-4 py=2 rounded w-full">UPLOAD</button>
                <div id="UpStatus" class="mt-2 text-sm"></div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/wall.js"></script>
        <script src="js/upload.js"></script>
    </body>
</html>
